<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: transparent;
            color: white;
            padding: 40px;
            margin: 0;
        }

        .stats {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="stats" id="content">
        Chargement...
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                let totalWins = 0;
                let totalLosses = 0;
                
                stats.forEach(player => {
                    totalWins += player.todayWins;
                    totalLosses += player.todayLosses;
                });
                
                document.getElementById('content').innerHTML = `Aujourd'hui: ${totalWins}W - ${totalLosses}L`;
            } catch (error) {
                document.getElementById('content').innerHTML = 'Erreur de chargement';
            }
        }

        fetchStats();
        setInterval(fetchStats, 5 * 60 * 1000);
    </script>
</body>
</html>
